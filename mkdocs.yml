site_name: Hack Docs
theme:
  name: material
  custom_dir: overrides
  palette:
    # Palette clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre

    # Palette sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - search.suggest
plugins:
  - search
  # - i18n:
  #     docs_structure: suffix
  #     languages:
  #       - locale: fr
  #         default: true
  #         name: Français
  #         build: true
  #       - locale: en
  #         name: English
  #         build: true
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF, true]
          concurrency: 4
          aggregator:
            enabled: true
            output: .well-known/site.pdf
            covers: all
      buttons:
        - title: Télécharger en PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
nav:
  - Home: index.md
  - Web:
    - Home: web/index.md
    - Exploration: web/explo.md
    - Exploitation: web/exploit.md
site_url: https://lilierd.github.io/hack_docs/
use_directory_urls: true
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra_javascript:
  - javascripts/visit-counter.js
extra_css:
  - stylesheets/extra.css
extra:
  stats_api_url: !ENV [STATS_API_URL, "http://localhost:3001"]