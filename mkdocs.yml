site_name: Hack Docs
theme:
  name: material
  features:
    - search.suggest
plugins:
  - search
nav:
  - Web:
    # - web/index.md
    - Exploration: web/explo.md
    - Exploitation: web/exploit.md
site_url: https://lilierd.github.io/hack_docs/
use_directory_urls: true
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
extra_javascript:
  - javascripts/visit-counter.js