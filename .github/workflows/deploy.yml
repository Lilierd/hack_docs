name: Deploy docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: mkdocs build
        env:
          STATS_API_URL: ${{ secrets.STATS_API_URL }}
          MKDOCS_EXPORTER_PDF: true
      - run: grep -r "STATS_API_URL" site/ || echo "NOT FOUND IN BUILD OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment